<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 820" width="620" height="820" role="img" aria-labelledby="tvhTitle tvhDesc">
  <title id="tvhTitle">Pikkujouluvisan maskotti – veikeä IT-hahmo</title>
  <desc id="tvhDesc">Yksinkertainen, ystävällinen maskottihahmo: joulupukinhattu, pyöreät silmälasit, parta ja huppari. Läpinäkyvä tausta, sopii etusivulle.</desc>

  <defs>
    <linearGradient id="tvhHoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cabfff"/>
      <stop offset="1" stop-color="#8b78ee"/>
    </linearGradient>
    <linearGradient id="tvhHat" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f2554f"/>
      <stop offset="1" stop-color="#bf1d1d"/>
    </linearGradient>
    <symbol id="tvhSpark" viewBox="-20 -20 40 40">
      <path d="M0 -18 C3 -6 6 -3 18 0 C6 3 3 6 0 18 C-3 6 -6 3 -18 0 C-6 -3 -3 -6 0 -18 Z"/>
    </symbol>
  </defs>

  <!-- Vartalo -->
  <path d="M110 820 C110 660 200 560 310 560 C420 560 510 660 510 820 Z" fill="url(#tvhHoodie)"/>
  <ellipse cx="310" cy="584" rx="130" ry="46" fill="#6d5cd8"/>
  <path d="M258 580 L310 636 L362 580 C336 600 284 600 258 580 Z" fill="#4b3cb5"/>
  <path d="M288 596 q -6 34 -12 48" stroke="#f4f4ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="275" cy="648" r="6" fill="#e6e6ff"/>
  <path d="M332 596 q 6 34 12 48" stroke="#f4f4ff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="345" cy="648" r="6" fill="#e6e6ff"/>

  <!-- Kaula -->
  <rect x="278" y="486" width="64" height="90" fill="#e6b98e"/>

  <!-- Pää -->
  <ellipse cx="310" cy="382" rx="158" ry="156" fill="#3b2a20"/>
  <ellipse cx="162" cy="402" rx="18" ry="26" fill="#eec49a"/>
  <ellipse cx="458" cy="402" rx="18" ry="26" fill="#eec49a"/>
  <ellipse cx="310" cy="390" rx="150" ry="150" fill="#f6cfa6"/>

  <!-- Poskien puna -->
  <ellipse cx="208" cy="468" rx="24" ry="15" fill="#f4a3a3" fill-opacity="0.45"/>
  <ellipse cx="412" cy="468" rx="24" ry="15" fill="#f4a3a3" fill-opacity="0.45"/>

  <!-- Parta -->
  <path d="M168 402 C164 502 232 550 310 550 C388 550 456 502 452 402 C444 482 386 514 310 514 C234 514 176 482 168 402 Z" fill="#3b2a20"/>

  <!-- Nenä -->
  <path d="M296 452 q 14 24 28 8" stroke="#e3b183" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Suu (veikeä hymy) -->
  <path d="M274 484 q 36 32 72 0" stroke="#b5573f" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Silmät -->
  <ellipse cx="254" cy="440" rx="26" ry="30" fill="#ffffff"/>
  <ellipse cx="366" cy="440" rx="26" ry="30" fill="#ffffff"/>
  <circle cx="258" cy="436" r="15" fill="#2b2440"/>
  <circle cx="362" cy="436" r="15" fill="#2b2440"/>
  <circle cx="251" cy="428" r="5" fill="#ffffff"/>
  <circle cx="355" cy="428" r="5" fill="#ffffff"/>

  <!-- Silmälasit -->
  <rect x="210" y="396" width="88" height="84" rx="36" fill="#ffffff" fill-opacity="0.14" stroke="#2b2440" stroke-width="9"/>
  <rect x="322" y="396" width="88" height="84" rx="36" fill="#ffffff" fill-opacity="0.14" stroke="#2b2440" stroke-width="9"/>
  <path d="M298 438 q 12 -12 24 0" stroke="#2b2440" stroke-width="9" fill="none"/>
  <path d="M210 430 L176 444" stroke="#2b2440" stroke-width="9" stroke-linecap="round"/>
  <path d="M410 430 L444 444" stroke="#2b2440" stroke-width="9" stroke-linecap="round"/>

  <!-- Kulmakarvat (toinen koholla = veikeä) -->
  <path d="M224 384 C242 370 272 372 288 386" stroke="#3b2a20" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M332 374 C350 360 380 364 396 380" stroke="#3b2a20" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- Otsatukka -->
  <path d="M160 298 C200 330 254 312 310 320 C366 312 420 330 460 298 C448 342 388 366 310 366 C232 366 172 342 160 298 Z" fill="#3b2a20"/>

  <!-- Joulupukinhattu -->
  <path d="M404 158 C456 140 502 166 526 214" stroke="url(#tvhHat)" stroke-width="44" fill="none" stroke-linecap="round"/>
  <path d="M152 288 C152 164 254 112 332 122 C406 132 456 192 462 288 Z" fill="url(#tvhHat)"/>
  <circle cx="546" cy="228" r="32" fill="#f8fafc"/>
  <circle cx="538" cy="220" r="20" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="148" y="280" width="324" height="54" rx="27" fill="#f8fafc"/>

  <!-- Ajatuksen merkki ja kipinät -->
  <text x="490" y="150" text-anchor="middle" font-family="sans-serif" font-size="100" font-weight="900" fill="#e9d5ff">?</text>
  <use href="#tvhSpark" x="118" y="176" width="34" height="34" fill="#fbcfe8"/>
  <use href="#tvhSpark" x="380" y="62" width="26" height="26" fill="#c4b5fd"/>

  <!-- Näkyvä käsi, joka pitelee puhelinta -->
  <g id="tvhHandPhone">
    <!-- Hiha nousee olkapäältä -->
    <path d="M436 664 C472 630 524 592 552 512"
      stroke="url(#tvhHoodie)" stroke-width="60" fill="none" stroke-linecap="round"/>
    <!-- Hihan alareunan varjo -->
    <path d="M436 664 C472 630 524 592 552 512"
      stroke="#5b4bc4" stroke-width="60" fill="none" stroke-linecap="round" stroke-opacity="0.22"/>
    <!-- Kalvosin -->
    <ellipse cx="551" cy="512" rx="31" ry="21" fill="#4b3cb5" transform="rotate(-42 551 512)"/>

    <!-- Kämmen puhelimen takana -->
    <ellipse cx="557" cy="498" rx="31" ry="35" fill="#f6cfa6"/>

    <!-- Puhelin: pystyssä, kevyesti kallistettuna -->
    <g transform="rotate(-11 561 462)">
      <rect x="527" y="398" width="68" height="126" rx="16" fill="#1b1530" stroke="#0d0918" stroke-width="3"/>
      <rect x="534" y="407" width="54" height="108" rx="10" fill="#2b2440"/>
      <!-- Kysymys-/vastausruutu -->
      <rect x="540" y="415" width="42" height="10" rx="5" fill="#5ee9b5"/>
      <rect x="540" y="434" width="42" height="8" rx="4" fill="#a78bfa" fill-opacity="0.75"/>
      <rect x="540" y="451" width="28" height="8" rx="4" fill="#f2a9ff" fill-opacity="0.75"/>
      <rect x="552" y="502" width="18" height="5" rx="2.5" fill="#6b6486"/>
    </g>

    <!-- Sormet puhelimen etureunan päällä -->
    <rect x="521" y="450" width="31" height="19" rx="9.5" fill="#f6cfa6" transform="rotate(-11 536 459)"/>
    <rect x="521" y="480" width="31" height="19" rx="9.5" fill="#f6cfa6" transform="rotate(-11 536 489)"/>
    <!-- Peukalo ruudun reunalla -->
    <ellipse cx="537" cy="436" rx="12" ry="21" fill="#eec49a" transform="rotate(20 537 436)"/>
  </g>

  <!-- Toinen käsi: koholla samalla tavalla, mutta tyhjä (ei esinettä) -->
  <g id="tvhHandEmpty">
    <!-- Hiha nousee olkapäältä (peilikuva toisesta hihasta) -->
    <path d="M184 664 C148 630 96 592 68 512"
      stroke="url(#tvhHoodie)" stroke-width="60" fill="none" stroke-linecap="round"/>
    <!-- Hihan alareunan varjo -->
    <path d="M184 664 C148 630 96 592 68 512"
      stroke="#5b4bc4" stroke-width="60" fill="none" stroke-linecap="round" stroke-opacity="0.22"/>
    <!-- Kalvosin -->
    <ellipse cx="69" cy="512" rx="31" ry="21" fill="#4b3cb5" transform="rotate(42 69 512)"/>

    <!-- Kämmen -->
    <ellipse cx="63" cy="498" rx="32" ry="35" fill="#f6cfa6"/>

    <!-- Avoimet sormet osoittavat ylös -->
    <rect x="33" y="456" width="13" height="30" rx="6.5" fill="#f6cfa6" transform="rotate(-7 39 471)"/>
    <rect x="48" y="447" width="13" height="39" rx="6.5" fill="#f6cfa6" transform="rotate(-2 54 466)"/>
    <rect x="63" y="449" width="13" height="37" rx="6.5" fill="#f6cfa6" transform="rotate(3 69 467)"/>
    <rect x="78" y="458" width="13" height="28" rx="6.5" fill="#f6cfa6" transform="rotate(8 84 472)"/>
    <!-- Peukalo -->
    <ellipse cx="93" cy="488" rx="11" ry="19" fill="#eec49a" transform="rotate(-25 93 488)"/>
  </g>
</svg>
